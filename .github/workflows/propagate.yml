name: Propagate to fleet

# Fires on every push to main. Redeploys bot-core-canary first, polls its
# /healthz, and only then fans out redeploys to the rest of the fleet
# listed in deploy/fleet.json. A canary that doesn't come up healthy
# blocks the fan-out entirely — nothing else gets touched.
#
# Zeabur has no deploy-trigger webhook feature (confirmed against their
# Apollo Explorer schema — requested, not shipped). Redeploys go through
# Zeabur's GraphQL API instead, authenticated by one account-wide API
# token. One-time setup:
#   1. Create an API key at https://zeabur.com/account/api-keys
#   2. Add it here as a secret named ZEABUR_API_TOKEN
#      (Settings > Secrets and variables > Actions)
#
# To add a new service to the fleet: add an entry to deploy/fleet.json
# with its serviceID + environmentID (get these from the Zeabur GraphQL
# API/Apollo Explorer — they're identifiers, not secrets, safe to
# commit). No workflow YAML edits needed — one token authenticates every
# service's redeploy call.
#
# Until ZEABUR_API_TOKEN is configured, this workflow will run and fail
# loudly at the "missing secret" check rather than silently doing nothing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redeploy canary, then fan out to fleet
        env:
          ZEABUR_API_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
        run: python deploy/propagate.py
